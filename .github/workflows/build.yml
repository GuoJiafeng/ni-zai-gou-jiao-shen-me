name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          VERSION="v1.$((${GITHUB_RUN_NUMBER:-1} - 1))"
          cp "$APK_PATH" "你在狗叫什么-${VERSION}.apk"
          echo "apk_file=你在狗叫什么-${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.apk.outputs.apk_file }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.version }}
          name: 你在狗叫什么？ ${{ steps.apk.outputs.version }}
          body: |
            ## 你在狗叫什么？ ${{ steps.apk.outputs.version }}

            ### 安装
            下载下方 APK 文件，传输到 Android 手机直接安装即可。

            ### 功能
            - 🐶 YAMNet AI 狗叫识别（设备端离线推理）
            - 📧 检测到狗叫自动发邮件（含前后5秒录音附件）
            - 🔔 预设 QQ/163/Gmail 等常用邮箱
            - 📱 三页面：主页/历史（音频播放）/设置
            - ⚙️ 可调检测阈值和冷却时间
            - 🔒 后台保活：WakeLock+开机自启+WorkManager
          files: ${{ steps.apk.outputs.apk_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
